name: USB status tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  usb-status:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Resolve test dependencies
        run: gradle --no-daemon -b tests/dependencies.gradle resolveTestDependencies

      - name: Test JavaScript bridge
        run: node --test tests/bridge.test.js

      - name: Compile and test Android USB transport
        run: python3 tests/run-android-status-tests.py
